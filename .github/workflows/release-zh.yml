name: Release zh-Hans

# Push a tag like zh-v1.28.8 to build Linux AppImage + Windows installer and publish a zh-Hans release.
on:
  push:
    tags:
      - 'zh-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing zh-v* tag to build and release'
        required: true
        type: string

concurrency:
  group: release-zh-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # fetch-depth 0: the package version comes from git describe (qgc-package FATAL_ERRORs on 0.0.0)
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      # Repo-owned composite actions: CMake/Ninja, Python env, Qt 6.12.0 (cached, public mirrors)
      - name: Build Setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: linux
          qt-arch: linux_gcc_64
          build-type: Release

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          preset: Linux

      # i18n regression gate: fails the release if zh-CN coverage regressed
      - name: i18n regression gate
        run: python3 tools/i18n/check_zhcn.py

      - name: Build
        uses: ./.github/actions/cmake-build

      # Same as upstream linux.yml's Create AppImage step
      - name: Create AppImage
        working-directory: ${{ runner.temp }}/build
        run: cmake --install . --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: QGroundControl-x86_64
          path: ${{ runner.temp }}/build/QGroundControl-*.AppImage
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          notes="${RUNNER_TEMP}/release-notes.md"
          cat > "$notes" <<EOF
          QGroundControl 简体中文汉化版(非官方构建)

          - 上游:https://github.com/mavlink/qgroundcontrol
          - 本仓库在上游基础上完善 zh_CN 翻译,并为部分硬编码 UI 字符串补充了 qsTr()/tr() 包裹;详见 README.zh-CN.md
          - Linux:下载 AppImage,chmod +x 后直接运行
          EOF
          appimage=$(find "$RUNNER_TEMP/build" -name 'QGroundControl-*.AppImage' | head -n1)
          sha256sum "$appimage" > "$appimage.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$appimage" "$appimage.sha256" --clobber
          else
            gh release create "$TAG" --title "QGroundControl zh-Hans $TAG" \
              --notes-file "$notes" \
              "$appimage" "$appimage.sha256"
          fi

  windows:
    name: Windows amd64 Installer
    needs: linux            # serialize release creation; windows uploads to the release linux created
    runs-on: windows-2022    # hosted image ships MSVC 2022 and NSIS; no install-dependencies needed
    timeout-minutes: 150
    defaults:
      run:
        shell: cmd

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0     # package version comes from git describe and requires reachable tags
          persist-credentials: false

      - name: Build Setup
        id: build-setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: windows
          qt-arch: win64_msvc2022_64
          build-type: Release

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          preset: Windows
          extra-args: >-
            -DQGC_BUILD_PORTABLE_TESTS=OFF
            -DQGC_ENABLE_GST_VIDEOSTREAMING=ON
            -DQGC_CPACK_GENERATOR=NSIS

      # i18n regression gate: fails the release if zh-CN coverage regressed
      - name: i18n regression gate
        shell: cmd
        run: python tools\i18n\check_zhcn.py

      - name: Build
        uses: ./.github/actions/cmake-build

      # Same as upstream windows.yml's Create Installer step
      - name: Create Installer
        uses: ./.github/actions/cmake-build
        with:
          target: qgc-package
          parallel: 'false'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: QGroundControl-installer-AMD64
          path: ${{ runner.temp }}/build/QGroundControl-installer-*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          notes="${RUNNER_TEMP}/release-notes.md"
          cat > "$notes" <<EOF
          QGroundControl 简体中文汉化版(非官方构建)

          - 上游:https://github.com/mavlink/qgroundcontrol
          - 本仓库在上游基础上完善 zh_CN 翻译,并为部分硬编码 UI 字符串补充了 qsTr()/tr() 包裹;详见 README.zh-CN.md
          - Windows:下载 QGroundControl-installer-AMD64.exe 安装(未签名,SmartScreen 提示时选择保留即可)
          EOF
          installer=$(find "$RUNNER_TEMP/build" -name 'QGroundControl-installer-*.exe' | head -n1)
          sha256sum "$installer" > "$installer.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$installer" "$installer.sha256" --clobber
          else
            gh release create "$TAG" --title "QGroundControl zh-Hans $TAG" \
              --notes-file "$notes" \
              "$installer" "$installer.sha256"
          fi
